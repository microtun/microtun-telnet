name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag matches Cargo package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
      - name: Test
        run: cargo test --locked

  build-cross:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: linux
            arch: amd64
            executable: microtun-telnet
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: linux
            arch: arm64
            executable: microtun-telnet
            archive: tar.gz
          - target: x86_64-pc-windows-gnu
            os: windows
            arch: amd64
            executable: microtun-telnet.exe
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: Build
        run: cross build --locked --release --target "${{ matrix.target }}"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          stem="microtun-telnet-${GITHUB_REF_NAME}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "dist/${stem}"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${stem}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${stem}/"

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && zip -qr "${stem}.zip" "${stem}")
            rm -rf "dist/${stem}"
          else
            tar -C dist -czf "dist/${stem}.tar.gz" "${stem}"
            rm -rf "dist/${stem}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: microtun-telnet-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  build-darwin:
    name: Build darwin/${{ matrix.arch }}
    runs-on: macos-15
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: amd64
          - target: aarch64-apple-darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          stem="microtun-telnet-${GITHUB_REF_NAME}-darwin-${{ matrix.arch }}"
          mkdir -p "dist/${stem}"
          cp "target/${{ matrix.target }}/release/microtun-telnet" "dist/${stem}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${stem}/"
          tar -C dist -czf "dist/${stem}.tar.gz" "${stem}"
          rm -rf "dist/${stem}"
      - uses: actions/upload-artifact@v4
        with:
          name: microtun-telnet-darwin-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build-cross
      - build-darwin
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum microtun-telnet-* > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
